<!DOCTYPE html>

    <style>
        /* --- ARCHITECTURE CSS (LIGNES 10-500) --- */
        :root {
            --bg: #010409; --panel: #0d1117; --border: #30363d;
            --text: #c9d1d9; --accent: #58a6ff; --gold: #d29922;
            --success: #238636; --legend: #ab7df8;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 450px; background: var(--panel); border-right: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; overflow-y: auto; gap: 20px; }
        #main { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; }

        /* Moteur de Ligue */
        .league-banner { padding: 30px; border-radius: 15px; text-align: center; font-size: 32px; font-weight: 900; text-transform: uppercase; border: 2px solid rgba(255,255,255,0.1); transition: 0.5s; }
        .l-bronze { background: linear-gradient(135deg, #3d2311, #8b4513); box-shadow: 0 4px 15px rgba(139,69,19,0.3); }
        .l-silver { background: linear-gradient(135deg, #2c2c2c, #c0c0c0); color: #000; }
        .l-gold { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; box-shadow: 0 0 30px rgba(191,149,63,0.5); }
        .l-legend { background: linear-gradient(135deg, #1a1c2c, #ab7df8); animation: pulse 2s infinite; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* Formulaire & Graphique */
        .card { background: #161b22; border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        input { width: 100%; background: #010409; border: 1px solid var(--border); color: #fff; padding: 15px; border-radius: 8px; font-size: 18px; margin-top: 10px; }
        .btn { width: 100%; padding: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; text-transform: uppercase; }
        .btn-green { background: var(--success); color: white; }
        .btn-blue { background: var(--accent); color: white; }

        #svg-engine { width: 100%; height: 150px; background: #000; border-radius: 8px; margin-top: 15px; border: 1px solid var(--border); }
        .line { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linejoin: round; transition: 1s; }

        /* Grille de Trophées */
        .trophy-wall { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; }
        .trophy { aspect-ratio: 1; background: #21262d; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 35px; opacity: 0.1; filter: grayscale(1); transition: 0.8s; border: 2px solid transparent; }
        .trophy.unlocked { opacity: 1; filter: grayscale(0); border-color: var(--gold); background: #30363d; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }

        #log-console { background: #000; color: #00ff41; font-family: 'Consolas', monospace; padding: 15px; border-radius: 8px; height: 150px; overflow-y: auto; font-size: 12px; border: 1px solid var(--border); }
    </style>
</head>

<aside id="sidebar">
    <div id="league-display" class="league-banner l-bronze">Ligue Bronze</div>
    
    <div class="card">
        <label>TAUX HORAIRE (Variable Libre)</label>
        <input type="number" id="user-rate" placeholder="Entrez votre taux €">
        <button class="btn btn-green" onclick="Core.process()">VALIDER MOIS</button>
        <button class="btn btn-blue" onclick="Core.fullSimulation()">SIMULER 10 ANS</button>
    </div>

    <div class="card">
        <label>ÉVOLUTION EXPÉRIENCE</label>
        <svg id="svg-engine" viewBox="0 0 400 150">

        </svg>
    </div>

    <div class="card">

    </div>
</aside>

    { id: 0, icon: '🐣', name: 'Premier Pas' }, { id: 1, icon: '📅', name: '1 An Révolu' },

];

const Core = (() => {
    let state = { xp: 0, months: 0, years: 0, badges: [], league: 'bronze', history: [150] };

    const updateGraph = () => {
        const path = document.getElementById('graph-path');
        const points = state.history.map((y, i) => `${(i * 40)} ${y}`).join(' L ');
        path.setAttribute('d', `M ${points}`);
    };

    const process = () => {
        const rate = document.getElementById('user-rate').value;
        if(!rate) return alert("Saisissez un taux !");
        
        state.months++;
        state.xp += 120;
        state.years = Math.floor(state.months / 12);
        state.history.push(150 - (Math.min(state.xp / 50, 140)));
        if(state.history.length > 11) state.history.shift();

        checkUnlocks();
        render();
        log(`Mois ${state.months} validé. XP +120. Taux: ${rate}€/h`);
    };

    const fullSimulation = async () => {
        log("LANCEMENT DE LA SIMULATION 10 ANS...");
        for(let i=1; i<=120; i++) {
            state.months++;
            state.xp += 150;
            state.years = Math.floor(state.months / 12);
            state.history.push(150 - (Math.min(state.xp / 100, 140)));
            if(state.history.length > 11) state.history.shift();
            
            checkUnlocks();
            if(i % 12 === 0) {
                render();
                await new Promise(r => setTimeout(r, 40));
                log(`Année ${state.years} : Mise à jour des acquis.`);
            }
        }
        log("CARRIÈRE TERMINÉE. STATUT LÉGENDE.");
    };

    const checkUnlocks = () => {
        if(state.xp > 2000) state.league = 'silver';
        if(state.xp > 8000) state.league = 'gold';
        if(state.xp > 20000) state.league = 'legend';

        if(state.months >= 1 && !state.badges.includes(0)) state.badges.push(0);
        if(state.months >= 12 && !state.badges.includes(1)) state.badges.push(1);
        if(state.years >= 10 && !state.badges.includes(5)) state.badges.push(5);
    };

    const render = () => {
        const lDisplay = document.getElementById('league-display');
        lDisplay.className = `league-banner l-${state.league}`;
        lDisplay.innerText = `Ligue ${state.league}`;
        
        document.getElementById('stat-xp').innerText = state.xp;
        document.getElementById('stat-years').innerText = state.years;
        
        // Mur des trophées
        const wall = document.getElementById('trophy-wall');
        wall.innerHTML = '';
        TROPHIES.forEach(t => {
            const active = state.badges.includes(t.id) ? 'unlocked' : '';
            wall.innerHTML += `<div class="trophy ${active}" title="${t.name}">${t.icon}</div>`;
        });

        // Conseil
        const s = KNOWLEDGE_BASE[Math.floor(Math.random() * KNOWLEDGE_BASE.knowledge_base_length || KNOWLEDGE_BASE.length)];
        document.getElementById('adv-title').innerText = `${s.t} : ${s.h}`;
        document.getElementById('adv-text').innerText = s.c;
        document.getElementById('adv-ref').innerText = `RÉF: ${s.r}`;

        updateGraph();
    };

    const log = (m) => {
        const c = document.getElementById('log-console');
        c.innerHTML += `> ${m}<br>`;
        c.scrollTop = c.scrollHeight;
    };

    return { process, fullSimulation, init: render };
})();

window.onload = Core.init;
</script>
