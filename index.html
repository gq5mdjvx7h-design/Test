function run(){
 MONTHLY_DATA.totalHS=Number(document.getElementById("mhs").value);
 ANNUAL_DATA.yearTotal=Number(document.getElementById("ahs").value);
 const root=document.getElementById("scenarioList");
 root.innerHTML="";
 SCENARIOS.forEach(s=>{
  const data=s.type==="monthly"?MONTHLY_DATA:ANNUAL_DATA;
  if(s.test(data)){
   const d=document.createElement("div");
   d.className="scenario "+s.level;
   d.innerHTML=`<strong>${s.title}</strong><br>
   <strong>Constat :</strong> ${s.constat}<br>
   <strong>Signification :</strong> ${s.meaning}<br>
   <strong>Conséquence :</strong> ${s.consequence}<br>
   <strong>Action :</strong> ${s.action}<br>
   <small>${s.legal}</small>`;
   root.appendChild(d);
  }
 });
}
