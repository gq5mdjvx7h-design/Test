<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PAIE PERFORMANCE SYSTEM - HOURS ONLY EDITION</title>
    <style>
        :root {
            --bg: #010409; --panel: #0d1117; --border: #30363d;
            --text: #c9d1d9; --accent: #58a6ff; --gold: #d29922;
            --bronze: #8b4513; --legend: #ab7df8; --success: #238636;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 400px; background: var(--panel); border-right: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        #main { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; }

        .league-header { padding: 25px; border-radius: 12px; text-align: center; font-size: 28px; font-weight: 900; text-transform: uppercase; border: 2px solid rgba(255,255,255,0.1); }
        .l-bronze { background: linear-gradient(135deg, #3d2311, #8b4513); }
        .l-silver { background: linear-gradient(135deg, #2c2c2c, #c0c0c0); color: #000; }
        .l-gold { background: linear-gradient(135deg, #bf953f, #fcf6ba); color: #000; }
        .l-legend { background: linear-gradient(135deg, #1a1c2c, #ab7df8); box-shadow: 0 0 20px var(--legend); }

        .card { background: #161b22; border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        label { display: block; font-size: 11px; color: #8b949e; text-transform: uppercase; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; background: #010409; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
        
        .btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; transition: 0.2s; }
        .btn-calc { background: var(--success); color: white; }
        .btn-sim { background: var(--accent); color: white; }

        #graph-box { width: 100%; height: 120px; background: #000; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        .graph-path { fill: none; stroke: var(--accent); stroke-width: 3; transition: 1s; }

        .trophy-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .trophy { aspect-ratio: 1; background: #21262d; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; opacity: 0.1; filter: grayscale(1); transition: 0.5s; }
        .trophy.unlocked { opacity: 1; filter: grayscale(0); border: 1px solid var(--gold); background: #30363d; }

        #console { background: #000; color: #3fb950; font-family: 'Consolas', monospace; padding: 15px; border-radius: 8px; height: 150px; overflow-y: auto; font-size: 11px; border: 1px solid var(--border); }
    </style>
</head>
<body>

<aside id="sidebar">
    <div id="league-banner" class="league-header l-bronze">Ligue Bronze</div>
    
    <div class="card">
        <label>Volume Heures Supplémentaires</label>
        <input type="number" id="hs-input" placeholder="Nombre d'heures" value="0">
        
        <button class="btn btn-calc" onclick="App.process()">Enregistrer le Mois</button>
        <button class="btn btn-sim" onclick="App.simulateTenYears()">Simuler Carrière (10 ans)</button>
    </div>

    <div class="card">
        <label>Productivité (Courbe HS)</label>
        <svg id="graph-box" viewBox="0 0 400 120">
            <path id="graph-line" class="graph-path" d="M 0 120 L 400 120" />
        </svg>
    </div>

    <div class="card">
        <p>Ancienneté : <span id="stat-y">0</span> ans / <span id="stat-m">0</span> mois</p>
        <p>Cumul HS : <span id="stat-total-hs">0</span> h</p>
        <p>XP Système : <span id="stat-xp">0</span></p>
    </div>
</aside>

<main id="main">
    <div class="card" style="border-left: 10px solid var(--gold);">
        <h2 id="adv-title" style="margin:0; color:var(--gold);">Analyse Juridique</h2>
        <p id="adv-text" style="font-size: 18px; line-height: 1.5;">Saisissez vos heures supplémentaires pour débloquer les conseils.</p>
        <small id="adv-ref" style="color: var(--accent);"></small>
    </div>

    <div class="card">
        <label>Réalisations Débloquées</label>
        <div class="trophy-grid" id="trophy-wall"></div>
    </div>

    <div id="console"></div>
</main>

<script>
/**
 * BASE DE CONNAISSANCES TECHNIQUE (SANS MONTANTS)
 */
const DATABASE = [
    { t: "JURIDIQUE", h: "Majoration HS", c: "Les heures supplémentaires au-delà de 35h ouvrent droit à un repos compensateur ou une majoration.", r: "L3121-36" },
    { t: "BIEN-ÊTRE", h: "Gestion Fatigue", c: "Sois pas trop fatigué, pense à toi : trop d'heures sup impactent la vigilance en paie.", r: "Note Perso" },
    { t: "JURIDIQUE", h: "Contingent Annuel", c: "Dans le Commerce de Gros, le contingent annuel d'heures sup est fixé à 220h.", r: "Accord Branche" },
    { t: "JURIDIQUE", h: "Repos Obligatoire", c: "Toute heure sup effectuée au-delà du contingent ouvre droit à une contrepartie en repos.", r: "L3121-30" },
    { t: "BIEN-ÊTRE", h: "Déconnexion", c: "Même avec un gros volume d'heures, respecte tes 11h de repos quotidien.", r: "Santé Travail" },
    { t: "JURIDIQUE", h: "Ancienneté", c: "Votre ancienneté dans l'entreprise se calcule de date à date, incluant les périodes de suspension.", r: "Code Travail" },
    { t: "JURIDIQUE", h: "Heures de Nuit", c: "Le travail de nuit est encadré : il nécessite des contreparties en repos ou majoration.", r: "CCN Gros" },
    { t: "BIEN-ÊTRE", h: "Ergonomie", c: "Vérifie l'assise de ton siège après une longue série d'heures supplémentaires.", r: "Note Perso" },
    { t: "JURIDIQUE", h: "Dépassement", c: "La durée hebdomadaire absolue ne peut pas dépasser 48h sur une seule semaine.", r: "L3121-20" },
    { t: "JURIDIQUE", h: "Moyenne 12 sem.", c: "La durée hebdomadaire moyenne ne peut pas dépasser 44h sur 12 semaines consécutives.", r: "L3121-22" },
    { t: "JURIDIQUE", h: "Pause Légale", c: "Dès que le temps de travail atteint 6h, une pause de 20 minutes est obligatoire.", r: "L3121-16" },
    { t: "JURIDIQUE", h: "HS & Congés", c: "Les heures supplémentaires sont prises en compte pour le calcul de l'indemnité de congés payés.", r: "Règle du 10ème" },
    { t: "BIEN-ÊTRE", h: "Récupération", c: "Utilise tes repos compensateurs pour maintenir ton efficacité sur le long terme.", r: "Note Perso" }
];

const TROPHIES = [
    {id:0, icon:'🐣'}, {id:1, icon:'📅'}, {id:2, icon:'🔥'}, {id:3, icon:'🤝'}, {id:4, icon:'💎'},
    {id:5, icon:'👑'}, {id:6, icon:'💼'}, {id:7, icon:'⚡'}, {id:8, icon:'🌙'}, {id:9, icon:'🛡️'}
];

const App = {
    state: { xp: 0, months: 0, years: 0, totalHS: 0, badges: [], league: 'bronze', history: [120] },

    init() {
        const saved = localStorage.getItem('PAIE_HS_V9');
        if(saved) this.state = JSON.parse(saved);
        this.render();
        this.log("SYSTEME INITIALISÉ : MODE HEURES SUP UNIQUEMENT.");
    },

    process() {
        const hs = parseFloat(document.getElementById('hs-input').value) || 0;
        
        this.state.months++;
        this.state.totalHS += hs;
        this.state.xp += 50 + (hs * 2); // L'XP augmente plus vite avec les HS
        this.state.years = Math.floor(this.state.months / 12);
        
        // Graphique basé sur le volume HS mensuel
        this.state.history.push(120 - (Math.min(hs * 3, 110)));
        if(this.state.history.length > 10) this.state.history.shift();

        this.checkLeagues();
        this.checkBadges(hs);
        this.render();
        this.save();
        this.log(`Mois enregistré. +${hs}h supplémentaires. Total: ${this.state.totalHS}h`);
    },

    async simulateTenYears() {
        this.log("SIMULATION DÉCENNALE EN COURS...");
        for(let i=1; i<=120; i++) {
            const hsAlea = Math.floor(Math.random() * 20); // Simule entre 0 et 20h sup par mois
            this.state.months++;
            this.state.totalHS += hsAlea;
            this.state.xp += 60 + (hsAlea * 2);
            this.state.years = Math.floor(this.state.months / 12);
            
            this.state.history.push(120 - (Math.min(hsAlea * 3, 110)));
            if(this.state.history.length > 10) this.state.history.shift();
            
            this.checkLeagues();
            this.checkBadges(hsAlea);
            if(i % 12 === 0) {
                this.render();
                await new Promise(r => setTimeout(r, 40));
            }
        }
        this.save();
        this.log("SIMULATION TERMINÉE. RANG LÉGENDE ATTEINT.");
    },

    checkLeagues() {
        if(this.state.xp > 1500) this.state.league = 'silver';
        if(this.state.xp > 6000) this.state.league = 'gold';
        if(this.state.xp > 15000) this.state.league = 'legend';
    },

    checkBadges(currentHS) {
        if(this.state.months >= 1 && !this.state.badges.includes(0)) this.state.badges.push(0);
        if(this.state.years >= 1 && !this.state.badges.includes(1)) this.state.badges.push(1);
        if(currentHS > 20 && !this.state.badges.includes(2)) this.state.badges.push(2); // Badge "Feu" si bcp d'HS
        if(this.state.years >= 10 && !this.state.badges.includes(5)) this.state.badges.push(5);
    },

    render() {
        document.getElementById('stat-xp').innerText = Math.floor(this.state.xp);
        document.getElementById('stat-m').innerText = this.state.months;
        document.getElementById('stat-y').innerText = this.state.years;
        document.getElementById('stat-total-hs').innerText = this.state.totalHS.toFixed(1);
        
        const b = document.getElementById('league-banner');
        b.className = `league-header l-${this.state.league}`;
        b.innerText = `Ligue ${this.state.league}`;

        const wall = document.getElementById('trophy-wall');
        wall.innerHTML = '';
        TROPHIES.forEach(t => {
            const unlocked = this.state.badges.includes(t.id) ? 'unlocked' : '';
            wall.innerHTML += `<div class="trophy ${unlocked}">${t.icon}</div>`;
        });

        const s = DATABASE[Math.floor(Math.random() * DATABASE.length)];
        document.getElementById('adv-title').innerText = `${s.t} : ${s.h}`;
        document.getElementById('adv-text').innerText = s.c;
        document.getElementById('adv-ref').innerText = `RÉFÉRENCE : ${s.r}`;

        const path = document.getElementById('graph-line');
        const d = this.state.history.map((y, i) => `${i * 40} ${y}`).join(' L ');
        path.setAttribute('d', `M ${d}`);
    },

    log(m) {
        const c = document.getElementById('console');
        c.innerHTML += `> [${new Date().toLocaleTimeString()}] ${m}<br>`;
        c.scrollTop = c.scrollHeight;
    },

    save() { localStorage.setItem('PAIE_HS_V9', JSON.stringify(this.state)); }
};

window.onload = () => App.init();
</script>
</body>
</html>
